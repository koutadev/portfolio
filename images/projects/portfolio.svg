<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg2)"/>

  <!-- Browser window -->
  <g transform="translate(50, 40)">
    <!-- Window frame -->
    <rect x="0" y="0" width="300" height="180" rx="5" fill="white" opacity="0.1"/>
    <rect x="0" y="0" width="300" height="25" rx="5" fill="white" opacity="0.2"/>

    <!-- Window controls -->
    <circle cx="15" cy="12" r="4" fill="#FF5F57"/>
    <circle cx="30" cy="12" r="4" fill="#FFBD2E"/>
    <circle cx="45" cy="12" r="4" fill="#28CA42"/>

    <!-- URL bar -->
    <rect x="65" y="7" width="220" height="11" rx="3" fill="white" opacity="0.2"/>

    <!-- Content area -->
    <rect x="10" y="35" width="280" height="15" rx="3" fill="white" opacity="0.3"/>
    <rect x="10" y="55" width="200" height="10" rx="2" fill="white" opacity="0.2"/>
    <rect x="10" y="70" width="150" height="10" rx="2" fill="white" opacity="0.2"/>

    <!-- Cards -->
    <rect x="10" y="90" width="85" height="80" rx="3" fill="white" opacity="0.2"/>
    <rect x="105" y="90" width="85" height="80" rx="3" fill="white" opacity="0.2"/>
    <rect x="200" y="90" width="85" height="80" rx="3" fill="white" opacity="0.2"/>
  </g>

  <!-- Title -->
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Portfolio Website</text>
</svg>
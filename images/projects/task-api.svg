<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg1)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="50" x2="400" y2="50" stroke="white" stroke-width="1"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="white" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="250" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="250" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="250" stroke="white" stroke-width="1"/>
  </g>

  <!-- API Icon -->
  <g transform="translate(200, 90)">
    <!-- Brackets -->
    <text x="-50" y="0" font-family="monospace" font-size="48" fill="white" opacity="0.9">{</text>
    <text x="30" y="0" font-family="monospace" font-size="48" fill="white" opacity="0.9">}</text>

    <!-- API Text -->
    <text x="0" y="8" font-family="monospace" font-size="20" fill="white" text-anchor="middle" font-weight="bold">API</text>
  </g>

  <!-- Title -->
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">Task Management</text>
  <text x="200" y="185" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">REST API</text>

  <!-- Tech badges -->
  <g transform="translate(200, 210)">
    <rect x="-35" y="0" width="30" height="18" rx="3" fill="white" opacity="0.2"/>
    <text x="-20" y="13" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">PHP</text>

    <rect x="5" y="0" width="30" height="18" rx="3" fill="white" opacity="0.2"/>
    <text x="20" y="13" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">JWT</text>
  </g>
</svg>
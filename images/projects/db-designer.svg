<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg3)"/>

  <!-- Grid dots -->
  <g opacity="0.2">
    <circle cx="50" cy="50" r="1" fill="white"/>
    <circle cx="100" cy="50" r="1" fill="white"/>
    <circle cx="150" cy="50" r="1" fill="white"/>
    <circle cx="200" cy="50" r="1" fill="white"/>
    <circle cx="250" cy="50" r="1" fill="white"/>
    <circle cx="300" cy="50" r="1" fill="white"/>
    <circle cx="350" cy="50" r="1" fill="white"/>
    <circle cx="50" cy="100" r="1" fill="white"/>
    <circle cx="100" cy="100" r="1" fill="white"/>
    <circle cx="150" cy="100" r="1" fill="white"/>
    <circle cx="200" cy="100" r="1" fill="white"/>
    <circle cx="250" cy="100" r="1" fill="white"/>
    <circle cx="300" cy="100" r="1" fill="white"/>
    <circle cx="350" cy="100" r="1" fill="white"/>
    <circle cx="50" cy="150" r="1" fill="white"/>
    <circle cx="100" cy="150" r="1" fill="white"/>
    <circle cx="150" cy="150" r="1" fill="white"/>
    <circle cx="200" cy="150" r="1" fill="white"/>
    <circle cx="250" cy="150" r="1" fill="white"/>
    <circle cx="300" cy="150" r="1" fill="white"/>
    <circle cx="350" cy="150" r="1" fill="white"/>
    <circle cx="50" cy="200" r="1" fill="white"/>
    <circle cx="100" cy="200" r="1" fill="white"/>
    <circle cx="150" cy="200" r="1" fill="white"/>
    <circle cx="200" cy="200" r="1" fill="white"/>
    <circle cx="250" cy="200" r="1" fill="white"/>
    <circle cx="300" cy="200" r="1" fill="white"/>
    <circle cx="350" cy="200" r="1" fill="white"/>
  </g>

  <!-- Table 1 -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="100" height="80" rx="3" fill="white" opacity="0.9"/>
    <rect x="0" y="0" width="100" height="20" rx="3" fill="#4B5563"/>
    <text x="50" y="14" font-family="monospace" font-size="11" fill="white" text-anchor="middle">users</text>
    <text x="5" y="35" font-family="monospace" font-size="9" fill="#6B7280">id: int</text>
    <text x="5" y="48" font-family="monospace" font-size="9" fill="#6B7280">name: varchar</text>
    <text x="5" y="61" font-family="monospace" font-size="9" fill="#6B7280">email: varchar</text>
    <text x="5" y="74" font-family="monospace" font-size="9" fill="#6B7280">created_at: date</text>
  </g>

  <!-- Table 2 -->
  <g transform="translate(220, 60)">
    <rect x="0" y="0" width="100" height="80" rx="3" fill="white" opacity="0.9"/>
    <rect x="0" y="0" width="100" height="20" rx="3" fill="#4B5563"/>
    <text x="50" y="14" font-family="monospace" font-size="11" fill="white" text-anchor="middle">tasks</text>
    <text x="5" y="35" font-family="monospace" font-size="9" fill="#6B7280">id: int</text>
    <text x="5" y="48" font-family="monospace" font-size="9" fill="#6B7280">user_id: int</text>
    <text x="5" y="61" font-family="monospace" font-size="9" fill="#6B7280">title: varchar</text>
    <text x="5" y="74" font-family="monospace" font-size="9" fill="#6B7280">status: enum</text>
  </g>

  <!-- Relationship line -->
  <line x1="180" y1="100" x2="220" y2="100" stroke="white" stroke-width="2" opacity="0.8"/>
  <text x="200" y="95" font-family="Arial" font-size="10" fill="white" text-anchor="middle">1:n</text>

  <!-- Table 3 -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="100" height="67" rx="3" fill="white" opacity="0.9"/>
    <rect x="0" y="0" width="100" height="20" rx="3" fill="#4B5563"/>
    <text x="50" y="14" font-family="monospace" font-size="11" fill="white" text-anchor="middle">categories</text>
    <text x="5" y="35" font-family="monospace" font-size="9" fill="#6B7280">id: int</text>
    <text x="5" y="48" font-family="monospace" font-size="9" fill="#6B7280">name: varchar</text>
    <text x="5" y="61" font-family="monospace" font-size="9" fill="#6B7280">color: varchar</text>
  </g>

  <!-- Relationship line 2 -->
  <line x1="250" y1="140" x2="250" y2="150" stroke="white" stroke-width="2" opacity="0.8"/>

  <!-- Title -->
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Database Schema Designer</text>
</svg>